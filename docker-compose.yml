# Apex Bot + Caddy (automatisches HTTPS). Start: docker compose up -d --build
services:
  apex:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [apex]
volumes:
  caddy_data:
  caddy_config:
